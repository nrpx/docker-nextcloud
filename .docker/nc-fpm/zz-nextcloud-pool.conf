[www]
; This host has 2 GiB shared with PostgreSQL, Valkey, Talk and other services.
; Keep a bounded dynamic pool rather than PHP's default five workers.
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; I/O waits do not reliably count toward PHP max_execution_time on Linux.
; Reclaim stuck workers even after fastcgi_finish_request/shutdown callbacks.
request_terminate_timeout = 300s
request_terminate_timeout_track_finished = yes

; Keep diagnostics in Portainer's existing size-limited container log.
request_slowlog_timeout = 60s
request_slowlog_trace_depth = 30
slowlog = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r\" %s duration=%{milliseconds}dms peak_memory=%{megabytes}MMB"

; Query with Docker exec only, including when the application pool is full.
pm.status_path = /fpm-status
pm.status_listen = 127.0.0.1:9001

[global]
process_control_timeout = 10s
